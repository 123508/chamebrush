  <circle id="moon" opacity="1" cx="701" cy="554" r="18" fill="#C7F36B" stroke="none" />
  <text id="eyebrow" opacity="1" x="72" y="72" fill="#C7F36B" font-family="Avenir Next, sans-serif" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="alphabetic"><tspan x="72">CHAMEBRUSH PRESENTS  /  06.21</tspan></text>
  <text id="title" opacity="1" x="68" y="142" fill="#F5F0E8" font-family="Avenir Next, sans-serif" font-size="76" font-weight="700" text-anchor="start" dominant-baseline="alphabetic"><tspan x="68">AURORA</tspan><tspan x="68" dy="0.92em">AFTER DARK</tspan></text>
  <path id="titleRule" opacity="1" d="M 72 326 L 424 326" fill="none" stroke="#FF8066" stroke-width="8" stroke-linecap="round" stroke-linejoin="miter" />
