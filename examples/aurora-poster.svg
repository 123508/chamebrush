  <g id="venueCard" opacity="1"><defs><filter id="shadow-venueCard.panel" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="18" stdDeviation="17" flood-color="#00000033" /></filter></defs><rect id="venueCard.panel" opacity="1" filter="url(#shadow-venueCard.panel)" x="72" y="548" width="430" height="168" rx="24" fill="#1B203B" stroke="#FFFFFF24" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" /><circle id="venueCard.marker" opacity="1" cx="114" cy="590" r="15" fill="#C7F36B" stroke="none" /><text id="venueCard.date" opacity="1" x="144" y="590" fill="#F5F0E8" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="144">FRI 21 JUN</tspan></text><text id="venueCard.venue" opacity="1" x="100" y="639" fill="#AEB4CB" font-family="sans-serif" font-size="15" font-weight="600" text-anchor="start" dominant-baseline="alphabetic"><tspan x="100">ROOFTOP 08 · SHANGHAI</tspan></text><text id="venueCard.time" opacity="1" x="100" y="678" fill="#FF8066" font-family="sans-serif" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="alphabetic"><tspan x="100">20:30 — LATE</tspan></text><text id="venueCard.entry" opacity="1" x="474" y="678" fill="#AEB4CB" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="alphabetic"><tspan x="474">LIVE / VISUAL / OPEN AIR</tspan></text></g>
