  <text id="note" opacity="1" x="1128" y="756" fill="#8A90AA" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="end" dominant-baseline="alphabetic"><tspan x="1128">A DECLARATIVE POSTER</tspan></text>
